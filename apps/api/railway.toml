[build]
builder = "nixpacks"
buildCommand = "pnpm install --filter @circles/api... && pnpm --filter @circles/database db:generate && pnpm --filter @circles/api build"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
